<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de asesores · Ingreso</title>
<link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
<main class="auth">
  <form class="auth-card" id="form" novalidate>
    <h1 id="titulo">Panel de asesores</h1>
    <p class="sub" id="subtitulo">Ingresa para atender los chats de WhatsApp.</p>
    <div class="aviso" id="aviso"></div>
    <div class="campo" id="campo-nombre" hidden>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" autocomplete="name">
    </div>
    <div class="campo">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="8">
    </div>
    <button class="btn primario" id="enviar" type="submit">Ingresar</button>
    <p class="auth-alt" id="alterno"></p>
  </form>
</main>
<script src="/static/clave.js"></script>
<script>
const esRegistro = location.pathname.startsWith('/registro');
const $ = (id) => document.getElementById(id);
if (esRegistro) {
  $('titulo').textContent = 'Crear cuenta de asesor';
  $('subtitulo').textContent = 'Un administrador aprobará tu cuenta antes de que puedas entrar.';
  $('campo-nombre').hidden = false;
  $('password').autocomplete = 'new-password';
  $('enviar').textContent = 'Crear cuenta';
  $('alterno').innerHTML = '¿Ya tienes cuenta? <a href="/login">Ingresa</a>';
} else {
  $('alterno').innerHTML = '¿Eres asesor nuevo? <a href="/registro">Crea tu cuenta</a>';
}
function aviso(texto, tipo) { const a = $('aviso'); a.textContent = texto; a.className = 'aviso ' + tipo; }

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const datos = { email: $('email').value.trim(), password: $('password').value };
  if (esRegistro) {
    datos.nombre = $('nombre').value.trim();
    if (datos.nombre.length < 2) return aviso('Escribe tu nombre.', 'error');
    if (datos.password.length < 8) return aviso('La contraseña debe tener al menos 8 caracteres.', 'error');
  }
  $('enviar').disabled = true;
  try {
    const r = await fetch(esRegistro ? '/api/registro' : '/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const d = j.detail;
      aviso(Array.isArray(d) ? 'Revisa los datos: correo válido y contraseña de 8+ caracteres.' : (d || 'Error'), 'error');
    } else if (esRegistro) {
      aviso(j.mensaje, 'ok');
      $('form').reset();
    } else {
      location.href = '/panel';
    }
  } catch { aviso('Sin conexión con el servidor.', 'error'); }
  $('enviar').disabled = false;
});
</script>
</body>
</html>
